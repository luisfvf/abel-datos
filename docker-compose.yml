# Despliegue en servidor propio: app + Postgres.
# Las credenciales se leen del archivo .env (lo genera el pipeline de GitLab en el servidor).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-relevamiento_db}
      POSTGRES_USER: ${DB_USER:-relevamiento}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  app:
    build: .
    image: relevamiento:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-relevamiento_db}
      DB_USER: ${DB_USER:-relevamiento}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${APP_PORT:-8000}:8000"

volumes:
  pgdata:
