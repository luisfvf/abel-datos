# Blueprint de Render: crea la base Postgres gratis y el servicio web, y los conecta.
# Deploy: Render Dashboard -> New -> Blueprint -> elegir este repositorio.

databases:
  - name: relevamiento-db
    plan: free
    region: virginia
    databaseName: relevamiento_db
    user: relevamiento

services:
  - type: web
    name: relevamiento
    runtime: python
    plan: free
    region: virginia  # misma región que la BD para usar la conexión interna
    buildCommand: pip install -r requirements.txt
    # --proxy-headers: Render atiende por HTTPS; sin esto el script recibiría URLs http://
    startCommand: uvicorn servidor2:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: relevamiento-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.7"
